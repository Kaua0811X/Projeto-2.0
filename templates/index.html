<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HealthAI — Triagem Médica</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* -------------- TEMA BRANCO COM DETALHES AZUIS --------------- */
:root{
    --bg-1:#ffffff;       /* Fundo principal branco */
    --bg-2:#f5faff;       /* Fundo degradê branco/azulado */
    --card:#e6f0ff;       /* Cartões azul bem claro */
    --glass:rgba(230,240,255,0.3); /* efeito glass azul claro */

    --txt:#001f3f;        /* Texto principal azul escuro */
    --txt-muted:#0d47a1;  /* Texto secundário azul */

    --accent:#0ea5e9;     /* Azul principal (botões, highlights) */
    --accent-2:#3b82f6;   /* Azul secundário para gradiente e hover */

    --radius:18px;
    --shadow:0 0 22px rgba(14,165,233,0.25); /* sombra azul */
    --border-glow:0 0 16px rgba(14,165,233,0.4); /* glow azul */
}

*{box-sizing:border-box;}
html, body { height:100%; }

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
}

/* ------------ HEADER --------------- */
header{
    padding:24px 32px;
    display:flex;
    align-items:center;
    background:rgba(14,165,233,0.1);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(14,165,233,0.2);
    box-shadow:var(--shadow);
}

.logo{
    width:56px;
    height:56px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:20px;
    background:linear-gradient(140deg, var(--accent), var(--accent-2));
    color:#ffffff;
}

.title{ font-size:22px; font-weight:600; }
.subtitle{ font-size:12px; color:var(--txt-muted); }

/* ------------ LAYOUT --------------- */
main{
    flex:1;
    padding:40px;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:1150px;
    display:grid;
    gap:38px;
    grid-template-columns: 1fr 420px;
}

/* ------------ PAINEL PRINCIPAL --------------- */
.panel{
    background:var(--glass);
    border:1px solid rgba(14,165,233,0.2);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px;
    backdrop-filter:blur(18px);
    animation:fadeUp .4s ease both;
}

.hero h1{ margin:0; font-size:26px; }
.hero p{ color:var(--txt-muted); margin-top:4px; }

/* ---- TEXTAREA ---- */
textarea{
    width:100%;
    min-height:160px;
    padding:16px;
    border-radius:14px;
    border:1px solid rgba(14,165,233,0.4);
    background:rgba(230,240,255,0.2);
    backdrop-filter:blur(8px);
    color:var(--txt);
    font-size:15px;
    resize:vertical;
    transition:.25s;
}

textarea:focus{
    border-color:var(--accent-2);
    box-shadow:0 0 16px rgba(14,165,233,0.3);
    outline:none;
}

/* ------------- BOTÕES --------------- */
.btn{
    padding:12px 20px;
    border-radius:12px;
    border:0;
    cursor:pointer;
    font-weight:600;
    transition:0.25s;
}

.btn.primary{
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#ffffff;
    box-shadow:var(--border-glow);
}

.btn.primary:hover{
    transform:scale(1.05);
    filter:brightness(1.15);
}

.btn.secondary{
    background:transparent;
    border:1px solid rgba(14,165,233,0.4);
    color:var(--txt-muted);
}

.btn.secondary:hover{
    transform:scale(1.05);
    border-color:var(--accent-2);
}

/* ------------ CARD DE RESULTADO --------------- */
.card{
    background:var(--glass);
    border-radius:var(--radius);
    padding:22px;
    border:1px solid rgba(14,165,233,0.2);
    backdrop-filter:blur(16px);
    box-shadow:var(--shadow);
}

.result{
    margin-top:12px;
    padding:16px;
    border-radius:14px;
    border:1px solid rgba(14,165,233,0.3);
    background:rgba(230,240,255,0.15);
    box-shadow:var(--border-glow);
}

.chip{
    padding:10px 14px;
    border-radius:30px;
    background:rgba(14,165,233,0.15);
    font-size:13px;
    border:1px solid rgba(14,165,233,0.4);
}

/* ------------- FOOTER --------------- */
footer{
    padding:20px;
    font-size:13px;
    color:var(--txt-muted);
    text-align:center;
}

/* ANIMAÇÃO */
@keyframes fadeUp{
    from { opacity:0; transform:translateY(25px); }
    to   { opacity:1; transform:none; }
}

/* RESPONSIVO */
@media(max-width:980px){
    .container{ grid-template-columns:1fr; }
}

</style>
</head>

<body>

<header>
    <div class="brand" style="display:flex; align-items:center; gap:14px;">
        <div class="logo">HA</div>
        <div>
            <div class="title">HealthAI</div>
            <div class="subtitle">Triagem Inteligente — Modo Futurista</div>
        </div>
    </div>
</header>

<main>
<div class="container">

<section class="panel">

    <div class="hero">
        <h1>Descreva seus sintomas</h1>
        <p>Digite com detalhes para uma análise mais precisa.</p>
    </div>

    <form id="triageForm">
        <label for="sintomas">Sintomas</label>
        <textarea id="sintomas" placeholder="Ex.: Febre 38°C, tosse seca e dor ao respirar..."></textarea>

        <div style="display:flex; gap:12px; margin-top:10px; align-items:center;">
            <button type="submit" class="btn primary" id="analyzeBtn">Analisar</button>
            <button type="button" class="btn secondary" id="clearBtn">Limpar</button>
            <span style="margin-left:auto; color:var(--txt-muted); font-size:13px;">
               
            </span>
        </div>

        <div id="feedback" style="margin-top:8px; color:var(--txt-muted); font-size:13px;"></div>
    </form>

</section>

<aside class="card">

    <h3 style="margin-top:0;">Resultado da Triagem</h3>
    <p class="meta">Status: <span id="statusMeta">Aguardando análise</span></p>

    <div id="resultBox" class="result" hidden>
        <p><strong>Sintomas:</strong> <span id="outSymptoms"></span></p>
        <p><strong>Possível condição:</strong> <span id="outCondition"></span></p>
        <p><strong>Especialista recomendado:</strong> <span id="outSpecialist"></span></p>
        <div id="outAdvice" class="suggestions" style="margin-top:14px;"></div>
    </div>

</aside>

</div>
</main>

<footer>
    HealthAI • Triagem Inteligente 2025 — Não substitui um médico.
</footer>


<script>

/* --- LÓGICA DA TRIAGEM --- */

const form = document.getElementById('triageForm');
const sintomas = document.getElementById('sintomas');
const feedback = document.getElementById('feedback');
const statusMeta = document.getElementById('statusMeta');
const resultBox = document.getElementById('resultBox');
const outSymptoms = document.getElementById('outSymptoms');
const outCondition = document.getElementById('outCondition');
const outSpecialist = document.getElementById('outSpecialist');
const outAdvice = document.getElementById('outAdvice');
const analyzeBtn = document.getElementById('analyzeBtn');
const clearBtn = document.getElementById('clearBtn');

function sanitize(t){
    return t.replace(/</g,'&lt;').replace(/>/g,'&gt;').trim();
}

function mockTriage(text){
    const t = text.toLowerCase();
    const r = { condition:"Não determinado", specialist:"Clínico Geral", advice:[] };

    if(!t) return r;

    if(/dor no peito|sudorese|pressão/.test(t)){
        r.condition = "Possível emergência cardíaca";
        r.specialist = "Pronto Socorro";
        r.advice.push("Procure atendimento IMEDIATO.");
    }
    else if(/febre|tosse/.test(t)){
        r.condition = "Infecção respiratória";
        r.specialist = "Clínico / Pneumo";
        r.advice.push("Hidratação e avaliação clínica.");
    }
    else {
        r.condition = "Inespecífico";
        r.specialist = "Clínico Geral";
        r.advice.push("Descreva mais detalhes.");
    }

    return r;
}

form.addEventListener("submit", e =>{
    e.preventDefault();

    const text = sanitize(sintomas.value);
    if(!text){
        feedback.textContent = "Descreva os sintomas antes de analisar.";
        return;
    }

    analyzeBtn.textContent = "Analisando...";
    analyzeBtn.disabled = true;
    statusMeta.textContent = "Analisando...";

    setTimeout(()=>{
        const r = mockTriage(text);

        outSymptoms.textContent = text;
        outCondition.textContent = r.condition;
        outSpecialist.textContent = r.specialist;

        outAdvice.innerHTML = "";
        r.advice.forEach(a =>{
            const c = document.createElement("div");
            c.className = "chip";
            c.textContent = a;
            outAdvice.appendChild(c);
        });

        resultBox.hidden = false;
        statusMeta.textContent = "Concluído";
        analyzeBtn.textContent = "Analisar";
        analyzeBtn.disabled = false;

    }, 700);
});

clearBtn.addEventListener("click", ()=>{
    sintomas.value = "";
    feedback.textContent = "";
    resultBox.hidden = true;
    statusMeta.textContent = "Aguardando análise";
});

</script>

</body>
</html>
